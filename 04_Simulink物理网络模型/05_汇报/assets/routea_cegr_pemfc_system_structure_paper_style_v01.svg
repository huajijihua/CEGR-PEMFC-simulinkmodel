<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Route A PEMFC-cEGR 系统结构图</title>
  <desc id="desc">依据活动 Simulink 主模型绘制。蓝色为阴极新鲜空气，红色为氢气，灰色为阴极尾气和被动 cEGR 回流，青色为冷却液，黄色为电能，绿色虚线为控制和测量。</desc>
  <defs>
    <marker id="air" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2079c8"/></marker>
    <marker id="h2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c84e45"/></marker>
    <marker id="gas" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66737d"/></marker>
    <marker id="water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#178d9a"/></marker>
    <marker id="power" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bb861a"/></marker>
    <marker id="control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b8b5c"/></marker>
    <style>
      .zone{fill:#fbfcfd;stroke:#d2dce2;stroke-width:1.5;stroke-dasharray:8 7}.zoneText{font:600 17px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#5a6872}.eq{fill:#f8fafb;stroke:#687680;stroke-width:2}.dark{fill:#6d7d87;stroke:#485761;stroke-width:2}.air{fill:none;stroke:#2079c8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#air)}.h2{fill:none;stroke:#c84e45;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#h2)}.gas{fill:none;stroke:#66737d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#gas)}.water{fill:none;stroke:#178d9a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#water)}.power{fill:none;stroke:#bb861a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#power)}.ctrl{fill:none;stroke:#3b8b5c;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;marker-end:url(#control)}.label{font:600 18px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#29343d;text-anchor:middle}.sub{font:14px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#5d6a73;text-anchor:middle}.flow{font:600 14px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#55626c}.note{font:13px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#66737c}.sensor{fill:#fff;stroke:#53616b;stroke-width:1.6}.sensorText{font:600 14px Arial,sans-serif;fill:#34414a;text-anchor:middle;dominant-baseline:central}.inside{font:600 21px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#fff;text-anchor:middle}.insideSub{font:14px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#e9eef0;text-anchor:middle}.legend{font:14px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#53616b}
    </style>
  </defs>
  <rect width="1600" height="950" fill="#fff"/>
  <text x="800" y="45" text-anchor="middle" style="font:600 28px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#26333b">Route A PEMFC-cEGR 系统结构图</text>
  <text x="800" y="74" text-anchor="middle" style="font:15px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#64717a">活动 Gas Mixture PEMFC 主模型的设备级可读化投影</text>

  <rect class="zone" x="42" y="105" width="1516" height="390" rx="10"/>
  <text class="zoneText" x="65" y="136">阴极空气、排气与被动 cEGR</text>
  <rect class="zone" x="42" y="525" width="1516" height="274" rx="10"/>
  <text class="zoneText" x="65" y="556">阳极供氢、循环、热管理与电能边界</text>

  <!-- cEGR loop: return direction is from separator to compressor inlet mixer -->
  <path class="gas" d="M1362 260 V178 H920"/>
  <path class="gas" d="M820 178 H728"/>
  <path class="gas" d="M612 178 H365 V248"/>
  <text class="flow" x="1010" y="159">cEGR 回流气</text>

  <!-- cathode fresh-air route -->
  <path class="air" d="M70 300 H112"/>
  <path class="air" d="M232 300 H304"/>
  <path class="air" d="M438 300 H504"/>
  <path class="air" d="M646 300 H714"/>
  <path class="air" d="M856 300 H910"/>
  <path class="air" d="M1020 300 H1078"/>
  <text class="flow" x="78" y="279">新鲜空气</text>

  <!-- cathode exhaust / water -->
  <path class="gas" d="M1236 300 H1298"/>
  <path class="gas" d="M1424 300 H1462"/>
  <text class="flow" x="1250" y="279">阴极尾气</text>
  <path class="water" d="M1362 344 V452"/>
  <text class="flow" x="1378" y="407">分离水代理</text>

  <!-- anode and recirculation -->
  <path class="h2" d="M70 662 H110"/>
  <path class="h2" d="M246 662 H318"/>
  <path class="h2" d="M510 662 H980 V430 H1000 V365 H1078"/>
  <path class="h2" d="M1236 380 H1260 V758 H654"/>
  <path class="h2" d="M534 758 H416 V706"/>
  <path class="gas" d="M1236 365 H1295 V662 H1362"/>
  <text class="flow" x="80" y="641">氢气</text>
  <text class="flow" x="752" y="738">阳极循环气</text>
  <text class="flow" x="1308" y="641">吹扫尾气</text>

  <!-- thermal and electrical -->
  <path class="water" d="M1125 380 V548"/>
  <path class="water" d="M1125 688 V735 H1266"/>
  <path class="water" d="M1364 735 V548 H1236"/>
  <text class="flow" x="1138" y="484">堆热量</text>
  <text class="flow" x="1272" y="719">冷却液</text>
  <path class="power" d="M1157 248 V170"/>
  <text class="flow" x="1170" y="213">电能</text>

  <!-- FCU control and measurement links -->
  <path class="ctrl" d="M1450 746 V477 H774 V204"/>
  <path class="ctrl" d="M1450 746 V452 H576 V204"/>
  <path class="ctrl" d="M1450 746 V460 H1157 V170"/>
  <path class="ctrl" d="M1450 746 V714 H1364 V688"/>

  <!-- cEGR valve and pipe -->
  <g>
    <path class="eq" d="M728 151 H780 L806 178 L780 205 H728 L702 178 Z"/>
    <path d="M731 165 L777 191 M777 165 L731 191" stroke="#718089" stroke-width="2"/>
    <text class="label" x="814" y="125">cEGR 调节阀</text><text class="sub" x="814" y="226">可变面积局部阻力</text>
  </g>
  <g>
    <rect class="eq" x="612" y="151" width="116" height="54" rx="27"/>
    <path d="M631 165 H709 M631 178 H709 M631 191 H709" stroke="#8a979f" stroke-width="1.6"/>
    <text class="label" x="655" y="125">EGR 管路</text><text class="sub" x="655" y="226">当前绝热</text>
  </g>
  <g transform="translate(828 151)"><circle class="sensor" r="16"/><text class="sensorText" y="1">P</text></g>
  <g transform="translate(864 151)"><circle class="sensor" r="16"/><text class="sensorText" y="1">P</text></g>

  <!-- cathode equipment -->
  <g>
    <rect class="eq" x="112" y="258" width="120" height="84" rx="4"/>
    <path d="M128 275 L215 326 M128 291 L196 331 M146 263 L215 305" stroke="#93a0a8" stroke-width="2"/>
    <text class="label" x="172" y="374">空气边界</text><text class="sub" x="172" y="397">Air Intake</text>
  </g>
  <g>
    <path class="eq" d="M304 258 H408 L438 300 L408 342 H304 L274 300 Z"/>
    <path d="M328 280 L415 320 M328 320 L415 280" stroke="#87949c" stroke-width="2"/>
    <text class="label" x="356" y="374">入口混合腔</text><text class="sub" x="356" y="397">新风 + cEGR</text>
  </g>
  <g>
    <path class="dark" d="M535 258 C493 258 493 342 535 342 H598 C653 342 669 258 598 258 Z"/>
    <circle cx="565" cy="300" r="23" fill="#eef2f4" stroke="#47555e" stroke-width="2"/>
    <path d="M565 278 V322 M543 300 H587 M550 285 L580 315 M580 285 L550 315" stroke="#66757f" stroke-width="2"/>
    <rect class="eq" x="598" y="279" width="48" height="42" rx="3"/>
    <text class="label" x="574" y="374">空气供给模块</text><text class="sub" x="574" y="397">流量源 + 图谱 + 容腔</text>
  </g>
  <g>
    <rect class="eq" x="714" y="258" width="142" height="84" rx="4"/>
    <path d="M732 276 H838 M732 289 H838 M732 302 H838 M732 315 H838" stroke="#84929a" stroke-width="2"/>
    <text class="label" x="785" y="374">进气阻力与测量</text><text class="sub" x="785" y="397">L2 接口 + P/T/RH/y_i</text>
  </g>
  <g>
    <rect class="eq" x="910" y="258" width="110" height="84" rx="4"/>
    <path d="M928 313 C935 287 945 287 952 313 C959 287 969 287 976 313 C983 287 993 287 1000 313" fill="none" stroke="#5a8ead" stroke-width="3"/>
    <text class="label" x="965" y="374">阴极加湿</text><text class="sub" x="965" y="397">RH 控制接口</text>
  </g>
  <g transform="translate(770 239)"><circle class="sensor" r="16"/><text class="sensorText" y="1">P</text></g>
  <g transform="translate(806 239)"><circle class="sensor" r="16"/><text class="sensorText" y="1">T</text></g>
  <g transform="translate(842 239)"><circle class="sensor" r="16"/><text class="sensorText" y="1">RH</text></g>

  <!-- stack -->
  <g>
    <rect class="dark" x="1078" y="248" width="158" height="132" rx="3"/>
    <g fill="#dce3e6"><rect x="1092" y="262" width="10" height="104"/><rect x="1110" y="262" width="10" height="104"/><rect x="1128" y="262" width="10" height="104"/><rect x="1146" y="262" width="10" height="104"/><rect x="1164" y="262" width="10" height="104"/><rect x="1182" y="262" width="10" height="104"/><rect x="1200" y="262" width="10" height="104"/><rect x="1218" y="262" width="10" height="104"/></g>
    <text class="inside" x="1157" y="305">PEM 燃料电池堆</text><text class="insideSub" x="1157" y="329">Stack Core / 官方 MEA</text>
    <text class="sub" x="1157" y="410">阳极、阴极、热端与电端耦合</text>
  </g>
  <!-- exhaust separator and BPR -->
  <g>
    <rect class="eq" x="1298" y="258" width="126" height="86" rx="4"/>
    <path d="M1327 275 Q1361 252 1395 275 V317 Q1361 340 1327 317 Z" fill="#e8eff1" stroke="#81909a" stroke-width="1.5"/>
    <path d="M1331 310 Q1361 295 1391 310 V318 Q1361 332 1331 318 Z" fill="#5f9eaa"/>
    <text class="label" x="1361" y="374">排气与水管理</text><text class="sub" x="1361" y="397">分离/冷凝水代理</text>
  </g>
  <g>
    <path class="eq" d="M1462 280 H1502 L1525 300 L1502 320 H1462 L1439 300 Z"/>
    <path d="M1468 289 H1497 M1468 300 H1497 M1468 311 H1497" stroke="#87949c" stroke-width="2"/>
    <text class="label" x="1482" y="374">背压/排放</text><text class="sub" x="1482" y="397">阀 + 环境边界</text>
  </g>
  <g transform="translate(1337 239)"><circle class="sensor" r="16"/><text class="sensorText" y="1">P</text></g>
  <g transform="translate(1373 239)"><circle class="sensor" r="16"/><text class="sensorText" y="1">T</text></g>

  <!-- anode equipment -->
  <g>
    <rect class="eq" x="110" y="620" width="136" height="84" rx="4"/>
    <rect x="154" y="631" width="48" height="49" rx="20" fill="#f6f8f9" stroke="#77858e" stroke-width="2"/>
    <path d="M178 631 V616 M163 616 H193" stroke="#67757e" stroke-width="3"/>
    <text class="label" x="178" y="735">储氢/供氢边界</text><text class="sub" x="178" y="757">Hydrogen Source</text>
  </g>
  <g>
    <path class="eq" d="M318 620 H480 L510 662 L480 704 H318 L288 662 Z"/>
    <path d="M345 644 H484 M345 662 H484 M345 680 H484" stroke="#87949c" stroke-width="2"/>
    <text class="label" x="399" y="735">减压与加湿</text><text class="sub" x="399" y="757">阀 + Humidifier</text>
  </g>
  <g>
    <rect class="eq" x="416" y="731" width="120" height="54" rx="27"/>
    <circle cx="449" cy="758" r="14" fill="#edf1f3" stroke="#70808a" stroke-width="2"/>
    <path d="M449 742 V774 M433 758 H465" stroke="#70808a" stroke-width="2"/>
    <text class="sub" x="491" y="815">阳极循环装置</text>
  </g>
  <g>
    <rect class="eq" x="1362" y="620" width="120" height="84" rx="4"/>
    <path d="M1380 662 H1464 M1400 641 V683 M1442 641 V683" stroke="#839199" stroke-width="3"/>
    <text class="label" x="1422" y="735">阳极吹扫</text><text class="sub" x="1422" y="757">Purge Valve</text>
  </g>

  <!-- electrical and thermal systems -->
  <g>
    <rect class="eq" x="1060" y="110" width="194" height="60" rx="30"/>
    <text class="label" x="1157" y="138">唯一电负载接口</text><text class="sub" x="1157" y="158">Current / Power / Voltage -&gt; I_cmd</text>
  </g>
  <g>
    <rect class="eq" x="1025" y="548" width="211" height="140" rx="4"/>
    <circle cx="1065" cy="618" r="25" fill="#e7f3f4" stroke="#568993" stroke-width="2"/>
    <path d="M1065 588 V648 M1035 618 H1095 M1044 597 L1086 639 M1086 597 L1044 639" stroke="#528690" stroke-width="2"/>
    <rect x="1132" y="575" width="78" height="86" fill="#edf5f6" stroke="#789ca2" stroke-width="1.5"/>
    <path d="M1142 592 H1200 M1142 606 H1200 M1142 620 H1200 M1142 634 H1200 M1142 648 H1200" stroke="#6e969d" stroke-width="2"/>
    <text class="label" x="1130" y="721">冷却泵与散热器</text><text class="sub" x="1130" y="744">Thermal Management BOP</text>
  </g>
  <g>
    <rect class="dark" x="1364" y="704" width="176" height="78" rx="5"/>
    <g fill="#dce4e7"><rect x="1381" y="720" width="28" height="14"/><rect x="1381" y="745" width="28" height="14"/><rect x="1418" y="720" width="28" height="14"/><rect x="1418" y="745" width="28" height="14"/></g>
    <text x="1490" y="733" style="font:600 17px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#fff;text-anchor:middle">FCU / BoP</text><text x="1490" y="756" style="font:14px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#e9eff1;text-anchor:middle">控制与观测</text>
  </g>

  <!-- legend and scope boundary -->
  <g transform="translate(78 850)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#2079c8" stroke-width="5"/><text class="legend" x="54" y="5">新鲜空气 / 阴极进气</text>
    <line x1="255" y1="0" x2="297" y2="0" stroke="#c84e45" stroke-width="5"/><text class="legend" x="309" y="5">氢气 / 阳极循环</text>
    <line x1="480" y1="0" x2="522" y2="0" stroke="#66737d" stroke-width="5"/><text class="legend" x="534" y="5">尾气 / cEGR</text>
    <line x1="675" y1="0" x2="717" y2="0" stroke="#178d9a" stroke-width="5"/><text class="legend" x="729" y="5">水 / 冷却液</text>
    <line x1="875" y1="0" x2="917" y2="0" stroke="#bb861a" stroke-width="5"/><text class="legend" x="929" y="5">电能</text>
    <line x1="1040" y1="0" x2="1082" y2="0" stroke="#3b8b5c" stroke-width="3" stroke-dasharray="8 6"/><text class="legend" x="1094" y="5">控制 / 测量</text>
  </g>
  <text class="note" x="78" y="894">说明: cEGR 为“出口分流 - 可变阀阻 - 管路 - 压缩机入口混合”的被动回流，实际回流量由网络压差、阀阻和管路共同决定。</text>
  <text class="note" x="78" y="918">水管理中的分离水为当前 L2 代理，不表示完整液水库存、输运、分离效率或可直接采购的硬件选型。</text>
</svg>
