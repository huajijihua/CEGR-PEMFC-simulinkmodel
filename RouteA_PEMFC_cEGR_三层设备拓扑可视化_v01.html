<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PEMFC-cEGR 三层设备拓扑可视化</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ink: #102033;
      --muted: #64748b;
      --grid: #e7ecf3;
      --stroke: #8291a6;
      --air: #2f7ed8;
      --egr: #df5c24;
      --exhaust: #6f7b8a;
      --h2: #12a36b;
      --coolant: #7c3aed;
      --electric: #f59e0b;
      --control: #4b5563;
      --stack: #d97706;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    header {
      padding: 14px 22px 10px;
      border-bottom: 1px solid var(--grid);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 10px 22px;
      border-bottom: 1px solid var(--grid);
      background: #fbfcfe;
    }

    .tabs {
      display: inline-grid;
      grid-template-columns: repeat(3, 150px);
      overflow: hidden;
      border: 1px solid var(--grid);
      border-radius: 6px;
      background: var(--panel);
    }

    button {
      height: 34px;
      border: 0;
      border-right: 1px solid var(--grid);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:last-child { border-right: 0; }

    button[aria-selected="true"] {
      background: #eaf4ff;
      color: #0f4e8a;
      font-weight: 700;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .swatch {
      width: 21px;
      height: 4px;
      border-radius: 2px;
      background: var(--grid);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 282px;
      gap: 14px;
      padding: 14px 22px 22px;
    }

    .canvas-shell,
    .info {
      border: 1px solid var(--grid);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 28px rgba(16, 32, 51, 0.08);
    }

    .canvas-shell {
      overflow: auto;
      min-width: 0;
    }

    .diagram-wrap {
      min-width: 1280px;
      padding: 12px;
    }

    svg {
      display: block;
      width: 1280px;
      height: 720px;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: -1px -1px;
    }

    .node rect {
      fill: #ffffff;
      stroke: var(--stroke);
      stroke-width: 1.15;
      rx: 5;
    }

    .node.boundary rect {
      fill: #f8fafc;
      stroke-dasharray: 5 4;
    }

    .node.stack rect {
      fill: #fff7ed;
      stroke: var(--stack);
      stroke-width: 1.6;
    }

    .node.control rect {
      fill: #f6f2ff;
      stroke: var(--electric);
    }

    .node:hover rect,
    .node.active rect {
      stroke: #0f4e8a;
      stroke-width: 2;
    }

    .node text {
      fill: var(--ink);
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .node text.sub {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    .pipe {
      fill: none;
      stroke-width: 3.2;
      stroke-linecap: square;
      stroke-linejoin: miter;
      marker-end: url(#arrow);
    }

    .pipe.air { stroke: var(--air); }
    .pipe.egr { stroke: var(--egr); }
    .pipe.exhaust { stroke: var(--exhaust); }
    .pipe.h2 { stroke: var(--h2); }
    .pipe.coolant { stroke: var(--coolant); }
    .pipe.electric { stroke: var(--electric); }
    .pipe.control {
      stroke: var(--control);
      stroke-width: 2;
      stroke-dasharray: 7 6;
      marker-end: url(#arrowThin);
    }

    .title {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 760;
    }

    .lane-label {
      fill: #334155;
      font-size: 11px;
      font-weight: 700;
    }

    .info {
      align-self: start;
      padding: 15px;
      min-height: 306px;
    }

    .info h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .info p,
    .info dd {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.58;
    }

    .info p { margin: 0 0 12px; }

    .info dl {
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .info dt {
      color: #334155;
      font-size: 12px;
      font-weight: 700;
    }

    .info dd {
      margin: 3px 0 0;
      color: var(--ink);
    }

    .note {
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid var(--grid);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: 1fr; width: 100%; }
      button { border-right: 0; border-bottom: 1px solid var(--grid); }
      button:last-child { border-bottom: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PEMFC-cEGR 三层设备拓扑可视化</h1>
    <p class="subtitle">按 Simulink 读图习惯重排：小设备块、正交连线、主气路横向展开，氢气和冷却回路在下方。</p>
  </header>

  <section class="toolbar" aria-label="拓扑切换和图例">
    <div class="tabs" role="tablist" aria-label="拓扑视图">
      <button type="button" role="tab" aria-selected="true" data-target="platform">RouteA_Platform</button>
      <button type="button" role="tab" aria-selected="false" data-target="bench">Bench_Config_v1</button>
      <button type="button" role="tab" aria-selected="false" data-target="vehicle">Vehicle_Config_v1</button>
    </div>
    <div class="legend" aria-label="管路图例">
      <span><i class="swatch" style="background:var(--air)"></i>空气/阴极</span>
      <span><i class="swatch" style="background:var(--egr)"></i>cEGR</span>
      <span><i class="swatch" style="background:var(--exhaust)"></i>排气</span>
      <span><i class="swatch" style="background:var(--h2)"></i>氢气/阳极</span>
      <span><i class="swatch" style="background:var(--coolant)"></i>冷却</span>
      <span><i class="swatch" style="background:var(--electric)"></i>电功率</span>
      <span><i class="swatch" style="background:var(--control)"></i>控制/测量</span>
    </div>
  </section>

  <main>
    <section class="canvas-shell" aria-label="设备拓扑图">
      <div class="diagram-wrap">
        <svg id="topology" viewBox="0 0 1280 720" role="img" aria-label="PEMFC-cEGR topology">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"></path>
            </marker>
            <marker id="arrowThin" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"></path>
            </marker>
          </defs>
        </svg>
      </div>
    </section>

    <aside class="info" aria-live="polite">
      <h2 id="info-title">RouteA_Platform</h2>
      <p id="info-summary">点击设备块查看角色说明。</p>
      <dl>
        <div>
          <dt>当前选择</dt>
          <dd id="info-name">通用平台完整结构</dd>
        </div>
        <div>
          <dt>角色</dt>
          <dd id="info-role">台架配置和车载配置的共同母版。</dd>
        </div>
        <div>
          <dt>说明</dt>
          <dd id="info-detail">主气路、cEGR、氢气、冷却、电功率、控制测量接口都在同一拓扑族内表达。</dd>
        </div>
      </dl>
      <div class="note">这是结构方案图，不表示 Simulink 模型已经完成所有对应改动。</div>
    </aside>
  </main>

    function n(id, title, sub, x, y, w, h, cls, role, detail) {
      return { id, title, sub, x, y, w, h, cls, role, detail };
    }

    function p(type, from, to, mode = "right") {
      return { type, from, to, mode };
    }

    function path(type, d) {
      return { type, d };
    }

    function nodeCenter(node, side) {
      if (side === "left") return [node.x, node.y + node.h / 2];
      if (side === "right") return [node.x + node.w, node.y + node.h / 2];
      if (side === "top") return [node.x + node.w / 2, node.y];
      if (side === "bottom") return [node.x + node.w / 2, node.y + node.h];
      return [node.x + node.w / 2, node.y + node.h / 2];
    }

    function makePath(pipe, nodes) {
      if (pipe.d) return pipe.d;
      const a = nodes.get(pipe.from);
      const b = nodes.get(pipe.to);
      let startSide = "right";
      let endSide = "left";
      if (pipe.mode === "left") {
        startSide = "left";
        endSide = "right";
      } else if (pipe.mode === "right-left") {
        startSide = "right";
        endSide = "left";
      }
      const [x1, y1] = nodeCenter(a, startSide);
      const [x2, y2] = nodeCenter(b, endSide);
      const mid = Math.round((x1 + x2) / 2);
      return `M${x1} ${y1} H${mid} V${y2} H${x2}`;
    }

    function setInfo(view, node) {
      infoTitle.textContent = view.title;
      if (!node) {
        infoSummary.textContent = "点击设备块查看角色说明。";
        infoName.textContent = view.intro.name;
        infoRole.textContent = view.intro.role;
        infoDetail.textContent = view.intro.detail;
        return;
      }
      infoSummary.textContent = "设备节点说明";
      infoName.textContent = node.title + (node.sub ? ` / ${node.sub}` : "");
      infoRole.textContent = node.role;
      infoDetail.textContent = node.detail;
    }

    function render(viewKey) {
      const view = views[viewKey];
      svg.querySelectorAll(".rendered").forEach((el) => el.remove());
      const layer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      layer.setAttribute("class", "rendered");
      svg.appendChild(layer);

      const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
      title.setAttribute("x", "24");
      title.setAttribute("y", "28");
      title.setAttribute("class", "title");
      title.textContent = view.header;
      layer.appendChild(title);

      view.lanes.forEach(([label, y]) => {
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", "24");
        t.setAttribute("y", String(y));
        t.setAttribute("class", "lane-label");
        t.textContent = label;
        layer.appendChild(t);
      });

      const nodeMap = new Map(view.nodes.map((item) => [item.id, item]));
      view.pipes.forEach((pipe) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
        line.setAttribute("class", `pipe ${pipe.type}`);
        line.setAttribute("d", makePath(pipe, nodeMap));
        layer.appendChild(line);
      });

      view.nodes.forEach((node) => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", `node ${node.cls || ""}`);
        g.setAttribute("tabindex", "0");
        g.addEventListener("click", () => {
          svg.querySelectorAll(".node.active").forEach((item) => item.classList.remove("active"));
          g.classList.add("active");
          setInfo(view, node);
        });
        g.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            g.dispatchEvent(new Event("click"));
          }
        });

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", node.x);
        rect.setAttribute("y", node.y);
        rect.setAttribute("width", node.w);
        rect.setAttribute("height", node.h);
        g.appendChild(rect);

        const main = document.createElementNS("http://www.w3.org/2000/svg", "text");
        main.setAttribute("x", node.x + node.w / 2);
        main.setAttribute("y", node.y + (node.sub ? node.h / 2 - 6 : node.h / 2));
        main.textContent = node.title;
        g.appendChild(main);

        if (node.sub) {
          const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
          sub.setAttribute("class", "sub");
          sub.setAttribute("x", node.x + node.w / 2);
          sub.setAttribute("y", node.y + node.h / 2 + 12);
          sub.textContent = node.sub;
          g.appendChild(sub);
        }
        layer.appendChild(g);
      });

      setInfo(view, null);
    }

    document.querySelectorAll("[data-target]").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll("[data-target]").forEach((item) => {
          item.setAttribute("aria-selected", String(item === tab));
        });
        render(tab.dataset.target);
      });
    });

    render("platform");
  </script>
</body>
